<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- 汉化游戏的中文显示修复（deckkit 自带，由 `deck games fonts` 安装）

       问题：这类汉化/日文游戏常把字体名**写死在数据里**，用的都是 Windows 上才有
       的字体（Meiryo UI / MS Gothic / MS Mincho / SimSun / 微软雅黑…）。SteamOS
       上没有这些字体 → 中文显示成方块、缺字、或字距错乱。

       ⚠️ 这一层**对 Proton（Wine）游戏没用**，只是留给 Linux 原生程序：
          Wine 优先命中 prefix 里**按文件名注册**的字体（C:\windows\Fonts\msgothic.ttc），
          不走 fontconfig 的 pattern 匹配 —— 实测 Deck 上 `fc-match "MS Gothic"` 明明
          已经指向 Noto CJK，Proton 游戏里照旧缺字（镇魂歌/三重奏…）。
          Proton 游戏真正管用的修复在 deck/winfonts.sh（`deck games fonts` 会一起装）。

       实测证据（fontconfig 这一层）：
         · 修复前 `fc-match "Meiryo UI"` → Adwaita Sans（纯拉丁，无 CJK）
         · 修复后 → Noto Sans CJK SC ✓
         · RPG Maker MZ 系（異世界転移）的 System.json 里 mainFontFilename =
           mplus-1m-regular.woff（**日文** M+ 字体）、fallbackFonts = "Verdana, sans-serif"

       做法：把常见 Windows 字体名**别名到 SteamOS 自带的 Noto CJK**（无需下载字体）。
       SteamOS 自带的是 Noto CJK（SC/TC/JP/HK 都在一个 ttc 里），所以不用装新字体。 -->

  <!-- 日文黑体系 → 中文无衬线 -->
  <match target="pattern"><test name="family"><string>Meiryo UI</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>Meiryo</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>MeiryoKe_UI</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>MS Gothic</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>MS PGothic</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>MS UI Gothic</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>Yu Gothic</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>Yu Gothic UI</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>YuGothic</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit></match>

  <!-- 日文衬线系 → 中文衬线 -->
  <match target="pattern"><test name="family"><string>MS Mincho</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>MS PMincho</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>Yu Mincho</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit></match>

  <!-- 简体中文字体名 → Noto CJK SC -->
  <match target="pattern"><test name="family"><string>SimSun</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>宋体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>NSimSun</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>新宋体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>SimHei</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>黑体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>Microsoft YaHei</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>Microsoft YaHei UI</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>微软雅黑</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>Microsoft JhengHei</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit></match>
  <match target="pattern"><test name="family"><string>微軟正黑體</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit></match>

  <!-- 兜底：任何字体请求都把中文字体追加进候选，
       避免"字体名不认识 → 退回纯拉丁字体 → 中文全丢" -->
  <match target="pattern">
    <edit name="family" mode="append" binding="weak"><string>Noto Sans CJK SC</string></edit>
  </match>
</fontconfig>